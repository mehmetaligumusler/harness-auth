name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Validate tag and determine prerelease
        id: check
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$TAG" | grep -qE '^v'; then
            echo "::error::Release tag must start with 'v' (got: '$TAG')"
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' already exists on the remote"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if printf '%s' "$TAG" | grep -qiE 'alpha|beta|rc'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: detect
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile

      - name: Build headless sidecar
        run: bun run build:sidecar

      - name: Run tests
        run: |
          bun test
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib

      - name: Build Windows NSIS installer
        run: pnpm --dir desktop tauri build --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: [detect, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-installer
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          name: HarnessAuth ${{ needs.detect.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.detect.outputs.is_prerelease }}
          files: dist/*
