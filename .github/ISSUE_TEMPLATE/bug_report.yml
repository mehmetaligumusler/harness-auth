name: Bug report
description: Report a reproducible problem with HarnessAuth (session switching, OAuth login, API config, installer, or ZCode service)
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with **HarnessAuth**. Please check that you are on the latest release and never paste raw API keys, OAuth tokens, or `accounts.json` / `sessions.json` secrets.

  - type: dropdown
    id: harness
    attributes:
      label: Affected Harness / Area
      options:
        - Claude Code
        - OpenCode
        - Antigravity CLI (agy)
        - ZCode Accounts / Embedded Engine
        - Windows Installer / Startup / Tray
        - UI / Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: HarnessAuth version
      description: Found in Settings → About (or commit hash if built from source)
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system & CLI version
      placeholder: "Windows 11 24H2 — claude 2.x / opencode 1.x / agy 1.x"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      placeholder: "Short description of the problem"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open HarnessAuth → Claude Code / OpenCode / Antigravity CLI
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual behavior
      placeholder: "What you expected to happen and what happened instead"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error details (redacted)
      description: Paste relevant lines from Service & Logs or `%APPDATA%\harness-auth\proxy\errors.log` with any tokens/keys replaced by `<redacted>`.
      render: shell

  - type: checkboxes
    id: redaction
    attributes:
      label: Privacy check
      options:
        - label: I confirmed no API keys, OAuth tokens, or personal credentials are included in this report
          required: true
